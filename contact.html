<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - OpenMicPhilly Hub</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            line-height: 1.6;
            color: #f5f5f5;
            background: #2C2C2C;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(45, 44, 44, 0.95);
            z-index: 50;
            padding: 1rem 0;
            backdrop-filter: blur(10px);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .logo {
            font-family: 'Oswald', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #D4A017;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a {
            color: #f5f5f5;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #D4A017;
        }

        .page-heading {
            margin-top: 90px;
            text-align: center;
            font-family: 'Oswald', sans-serif;
            font-size: 2.5rem;
            color: #D4A017;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .contact-section {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .contact-section p {
            font-size: 1.1rem;
            line-height: 1.7;
            margin-bottom: 1.5rem;
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .contact-form input,
        .contact-form textarea {
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid #D4A017;
            background: rgba(255, 255, 255, 0.1);
            color: #f5f5f5;
            font-size: 1rem;
        }

        .contact-form textarea {
            resize: vertical;
            height: 150px;
        }

        .contact-form button {
            background: #D4A017;
            color: #2C2C2C;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .contact-form button:hover {
            background: #FF6B35;
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <a href="#" class="logo">OpenMic<span style="color: #FF6B35;">Philly</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="collaborate.html">Collaborate</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </div>
    </nav>

    <h1 class="page-heading">Get in Touch</h1>

    <section class="contact-section">
        <p>Have a question, idea, or just want to say hey? Fill out the form below and someone from the OpenMicPhilly team will get back to you. Whether you're an artist, venue host, or curious local — we’d love to connect!</p>

        <form class="contact-form">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
            <textarea name="message" placeholder="Your Message" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </section>
</body>
</html>
